name: gate

# 质量门禁：编译 0 诊断 + 本地化守卫 + 格式守卫 + 资源卫生 + AgentIslandTests 全绿。
# 判据全部在 scripts/gate.sh 里（团队唯一入口），这里只负责在 macOS runner 上跑它。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # 必须是 macOS 26 镜像：工程开了 SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor 与
    # SWIFT_APPROACHABLE_CONCURRENCY（Swift 6.2 起的编译特性），Xcode 16.4 / Swift 6.1.2
    # 会忽略这两个设置，于是所有默认 MainActor 的类型都失去主 actor 隔离——实测 52 条诊断
    # 全是这个原因；另外部署目标 15.6 也高于 macos-15 镜像自带的 15.5 SDK。
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: 工具链版本（排障用）
        run: |
          xcodebuild -version
          swift --version

      - name: 编译 + 测试门禁
        env:
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/gate.sh --with-tests

      - name: 导出测试附件（失败时）
        if: failure()
        run: |
          XCR=$(ls -dt "$TMPDIR"/agent-island-gate/tests/Logs/Test/*.xcresult 2>/dev/null | head -1 || true)
          if [ -n "${XCR:-}" ]; then
            xcrun xcresulttool export attachments --path "$XCR" \
              --output-path "$TMPDIR/probe-attachments" || true
          fi

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gate-logs
          # 只传日志：门禁目录里还有整份派生数据（产物 + 索引），全传会变成几百 MB
          path: |
            ${{ runner.temp }}/agent-island-gate/*.log
            ${{ runner.temp }}/probe-attachments
          if-no-files-found: ignore
